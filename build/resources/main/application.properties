# ===============================
# [SPRING BOOT] Aplicación
# ===============================
spring.application.name=nequi-franchise-network
server.address=127.0.0.1
server.port=8080

# ===============================
# [DATABASE INIT - Ignorado si usas R2DBC]
# ===============================
# Si usas R2DBC, spring.sql.init.* no aplica directamente.
# Pero si usas Flyway o liquibase, aquí podrías configurarlo.
# Esto actualmente apunta a MySQL, no PostgreSQL ? corrígelo si no aplica.
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.sql.init.data-locations=classpath:schema.sql

# ===============================
# [SWAGGER / OPENAPI]
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.use-root-path=true

# Configuración personalizada de OpenAPI
openapi.service.title=${spring.application.name}
openapi.service.host=http://localhost:${server.port}
openapi.service.version=1.0.0
openapi.service.description=API RESTful para operaciones sobre ${spring.application.name}
openapi.service.contact.name=Victor Manuel Perez @ vimapeco24
openapi.service.contact.email=victor.perezc@pragma.com.co

# ===============================
# [LOGGING]
# ===============================
logging.level.org.springframework.r2dbc=DEBUG
